name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      # Warnings are errors (Directory.Build.props), so analyzers and code style gate the build.
      - run: dotnet build --no-restore -c Release
      # Password hashing, lockout, roles, forged/expired tokens, refresh rotation, reuse detection, sessions.
      - run: dotnet test --no-build -c Release

  web:
    name: SPA lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  container:
    name: Container (SPA + API, real cookies)
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Sign in, refresh, replay the old refresh token, and watch the session die
        run: |
          set -euo pipefail
          docker compose up -d
          u=http://localhost:8080
          for i in $(seq 1 30); do curl -fs $u/health && break; sleep 2; done
          curl -fs $u/ | grep -q '<div id="root">'
          curl -fs $u/.well-known/jwks.json | jq -e '.keys[0].alg == "ES256"'
          token=$(curl -fs -c jar -X POST $u/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"user@example.com","password":"correct-horse-battery"}' | jq -r .accessToken)
          curl -fs $u/api/me -H "Authorization: Bearer $token" | jq -e '.email == "user@example.com"'
          [ "$(curl -s -o /dev/null -w '%{http_code}' $u/api/admin/users -H "Authorization: Bearer $token")" = 403 ]
          old=$(awk '/__Secure-refresh/ {print $7}' jar)
          curl -fs -b jar -c jar -X POST $u/api/auth/refresh > /dev/null
          new=$(awk '/__Secure-refresh/ {print $7}' jar)
          [ "$old" != "$new" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST $u/api/auth/refresh -H "Cookie: __Secure-refresh=$old")" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST $u/api/auth/refresh -H "Cookie: __Secure-refresh=$new")" = 401 ]
      - if: always()
        run: docker compose logs && docker compose down -v

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the full history; the action builds a "<first>^..HEAD" range that fails on a root commit.
      - name: Scan full git history with gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
